name: commercial_analytics
version: "1.0.0"
config-version: 2
profile: commercial_analytics

model-paths: ["models"]
test-paths: ["tests"]

vars:
  raw_path: "{{ env_var('COMMERCIAL_RAW_PATH', 'data') }}"
  # Snapshot date of the data set: aging and recency are measured against it, not today,
  # so the marts give the same answers whenever they are rebuilt (same as vAsOf in the Qlik script).
  as_of: "2026-09-30"

models:
  commercial_analytics:
    staging:
      +materialized: view
    marts:
      +materialized: table
